[package]
name = "novabrowser"
version = "0.1.22"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
# our cef-rs branch nova-158: bindings from our CEF 158.0.3 build, experimental API
# (on_accelerated_paint2, packaging/cef-patches/osr-hold-texture.patch)
cef = { git = "https://github.com/Novaturiente/cef-rs", rev = "1e2efc0c8fe65216acf8a011ec1d03019e5f8db9" }
# the window and its interface (src/chrome/, from novabrowser-webkit); pages are off-screen
# CEF browsers drawn as GTK textures (src/page.rs)
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
# Shared with novabrowser-webkit; pinned rev, bump after pushing nova-core changes.
nova-core = { git = "https://github.com/Novaturiente/nova-core", rev = "96af9c8f86379177e531aab6a878d1f2ef2f2b1c" }
rusqlite = "0.40.2"
serde_json = "1.0.152"
