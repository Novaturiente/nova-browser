[package]
name = "novabrowser"
version = "0.1.8"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
cef = "=154.5.0"  # exact: must match the CEF binary version (154.0.34)
nova-core = { path = "../nova-core" }  # shared with novabrowser-webkit
oxc_allocator = "0.153"
oxc_codegen = "0.153"
oxc_parser = "0.153"
oxc_semantic = "0.153"
oxc_span = "0.153"
oxc_transformer = "0.153"
rquickjs = { version = "0.14.0", features = ["loader"] }
rusqlite = "0.40.2"
serde_json = "1.0.152"
