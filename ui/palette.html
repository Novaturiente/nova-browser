<!doctype html>
<meta charset="utf-8">
<title>palette</title>
<!--card-->
<style>
  /* The command palette / URL box: a card under the tab bar with the input on top and
     the completion below, one section per category. window.rs sets the width; the card
     takes the content's height (card.html reports it), up to `maxh` from nova.cmdline.
     Search (/, ?) is the input alone, a small card at the top centre. */
  body { font: var(--fonts-completion-entry, 10pt sans-serif); color: var(--ink); }
  #card { display: flex; flex-direction: column; }
  #bar { display: flex; align-items: center; gap: 12px; padding: 0 16px 0 12px; height: 46px; flex: 0 0 auto; }
  #icon { flex: 0 0 auto; width: 22px; height: 22px; display: grid; place-items: center; font-size: 15px;
          color: color-mix(in srgb, var(--ink) 55%, transparent); }
  body.compact #bar { height: 38px; }
  body.compact #list { display: none; }
  #count { flex: 0 0 auto; padding: 2px 9px; border-radius: 999px; font-variant-numeric: tabular-nums; font-size: .9em;
           color: color-mix(in srgb, var(--ink) 70%, transparent); background: color-mix(in srgb, var(--ink) 9%, transparent); }
  #count.none { color: var(--colors-messages-error-bg, #ff453a); background: color-mix(in srgb, var(--colors-messages-error-bg, #ff453a) 14%, transparent); }
  #count:empty { display: none; }
  #cmd::placeholder { color: inherit; opacity: .42; }
  #cmd { flex: 1; min-width: 0; box-sizing: border-box; padding: 0; border: 0; outline: 0; background: transparent;
         color: var(--colors-statusbar-command-fg, var(--ink)); caret-color: var(--accent);
         font: var(--fonts-statusbar, 11pt sans-serif); font-size: 1.1em; }
  /* sections share the height; a big one scrolls inside itself */
  #list { position: relative; display: flex; flex-direction: column; overflow: hidden; padding-bottom: 6px;
          border-top: 1px solid var(--hairline); }
  #list:empty { display: none; }
  /* min-height: shrink is weighted by size; every section keeps its header and ~3 rows */
  .grp { position: relative; flex: 0 1 auto; min-height: 9em; overflow-y: auto; scrollbar-width: none;
         padding: 0 6px; scroll-padding: 30px 0 4px; }
  .grp.small { flex-shrink: 0; min-height: 0; }
  .cat { position: sticky; top: 0; z-index: 3; display: flex; gap: 8px; align-items: baseline; padding: 9px 10px 4px;
         background: var(--card); font: var(--fonts-completion-category, 600 9pt sans-serif); letter-spacing: .02em;
         color: color-mix(in srgb, var(--colors-completion-category-fg, var(--ink)) 70%, transparent); }
  .cat small { font: inherit; font-weight: normal; opacity: .6; }
  /* the selection highlight slides between rows (positioned in the selected row's section) */
  #hl { position: absolute; left: 0; top: 0; z-index: 1; border-radius: 7px; pointer-events: none;
        background: var(--colors-completion-item-selected-bg, var(--accent));
        transition: transform 140ms var(--ease-out), width 140ms, height 140ms; }
  #hl.jump { transition: none; }
  @media (prefers-reduced-motion: reduce) { #hl { transition: none; } }
  .row { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 5px 10px;
         white-space: nowrap; border-radius: 7px; cursor: default; }
  .row:not(.sel):hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .row.sel { color: var(--colors-completion-item-selected-fg, #fff); }
  .row img, .row .fi { flex: 0 0 16px; width: 16px; height: 16px; border-radius: 4px; }
  .row .fi { background: color-mix(in srgb, currentColor 14%, transparent); }
  .a { flex: 0 1 60%; overflow: hidden; text-overflow: ellipsis; }
  .b { flex: 1; overflow: hidden; text-overflow: ellipsis; opacity: .55; }
  .row.sel .b { opacity: .8; }
</style>
<body>
<div id="card" class="fade"><div id="bar"><span id="icon"></span><input id="cmd" spellcheck="false"><span id="count"></span></div><div id="list"></div></div>
<script>
  const $ = (id) => document.getElementById(id);
  nova.theme = nova.vars;
  // Completion: nova.complete({title, items: [[text, description]], sel, cats}) or null.
  // One section per category (cats[i]; none = one section titled s.title). Rows with a
  // web address get the site icon from nova.icons (window.rs: the open tabs' favicons).
  const list = $("list");
  const icons = new Map();
  const site = (u) => { try { return new URL(u).host; } catch { return ""; } };
  const urlOf = (a, b) => [a, b].find((x) => /^https?:\/\//.test(x || "")) || "";
  const hl = document.createElement("div");
  hl.id = "hl";
  let lastItems = null;
  nova.complete = (s) => {
    const items = s ? s.items : [];
    const cats = (s && s.cats) || [];
    // same list, only `sel` moved: slide the highlight, don't rebuild
    if (s && lastItems === JSON.stringify([items, cats])) return select(s.sel, true);
    lastItems = s ? JSON.stringify([items, cats]) : null;
    const count = {};
    cats.forEach((c) => { count[c] = (count[c] || 0) + 1; });
    const groups = [];
    let grp = null;
    items.forEach(([a, b], i) => {
      const cat = cats[i] || (s && s.title) || "";
      if (!grp || cat !== (cats[i - 1] || (s && s.title) || "")) {
        grp = document.createElement("div");
        grp.className = "grp";
        if (cat) {
          const h = document.createElement("div");
          h.className = "cat";
          h.append(cat);
          if (count[cat]) h.append(Object.assign(document.createElement("small"), { textContent: count[cat] }));
          grp.append(h);
        }
        groups.push(grp);
      }
      const row = document.createElement("div");
      row.className = "row";
      const u = urlOf(a, b);
      if (u) {
        row.dataset.u = site(u);
        const src = icons.get(row.dataset.u);
        row.append(src ? Object.assign(document.createElement("img"), { src }) : Object.assign(document.createElement("span"), { className: "fi" }));
      }
      for (const [cls, text] of [["a", a], ["b", b]]) {
        const d = document.createElement("div");
        d.className = cls;
        d.textContent = text;
        row.append(d);
      }
      grp.append(row);
    });
    // short sections keep their size; the long ones shrink and scroll
    for (const g of groups) g.classList.toggle("small", g.querySelectorAll(".row").length <= 4);
    list.replaceChildren(...groups);
    if (s) select(s.sel, false);
  };
  const select = (sel, slide) => {
    const rows = list.querySelectorAll(".row");
    rows.forEach((r, i) => r.classList.toggle("sel", i === sel));
    const r = rows[sel];
    hl.style.display = r ? "" : "none";
    if (!r) return;
    const g = r.parentElement;
    // into another section: no slide (the sections scroll on their own)
    if (hl.parentElement !== g) { g.append(hl); slide = false; }
    r.scrollIntoView({ block: "nearest" });
    const lr = g.getBoundingClientRect(), rr = r.getBoundingClientRect();
    hl.classList.toggle("jump", !slide);
    hl.style.width = rr.width + "px";
    hl.style.height = rr.height + "px";
    hl.style.transform = `translate(${rr.left - lr.left - g.clientLeft}px, ${rr.top - lr.top - g.clientTop + g.scrollTop}px)`;
  };
  // nova.icons({host: data-url}): site icons from the open tabs
  nova.icons = (m) => {
    for (const [h, src] of Object.entries(m)) {
      icons.set(h, src);
      for (const r of list.querySelectorAll(".row")) {
        if (r.dataset.u === h && r.querySelector(".fi")) r.querySelector(".fi").replaceWith(Object.assign(document.createElement("img"), { src }));
      }
    }
  };
  // cmd-set-text: show the input with text, cursor at the end. compact = search.
  // `:open [-t|-b|-w] ` is kept out of sight (o/O just ask for an address, like Safari);
  // the core always gets and sends the full command line.
  let pre = "";
  const OPEN = /^:(?:open(?: -[tbw])*|bindings|profile-new) /;
  const full = () => pre + c.value;
  const show = (text) => {
    const m = text.match(OPEN);
    pre = m ? m[0] : "";
    c.value = text.slice(pre.length);
    const search = document.body.classList.contains("compact");
    c.placeholder = search ? "Find on page" : !pre ? "" : pre === ":bindings " ? "Filter key bindings…  (Esc closes)" : pre === ":profile-new " ? "Name for the new profile…" : / -[tw]/.test(pre) ? "Open in new tab…" : / -b/.test(pre) ? "Open in background tab…" : "Search or enter website name";
    c.setSelectionRange(c.value.length, c.value.length);
    $("icon").textContent = search || pre.startsWith(":open") ? "\u2315" : "\u203a";
    if (search && !c.value.slice(1)) $("count").textContent = "";
  };
  // search position "3 / 12" while typing a search (window.rs message, level find)
  nova.count = (t) => { $("count").textContent = t; $("count").className = t === "no match" ? "none" : ""; };
  // open: the palette is up and takes part in focus (its blur closes it)
  let open = false;
  // nova.cmdline(text, compact, maxh): maxh = the tallest the card may get (px)
  nova.cmdline = (text, compact, maxh) => {
    document.body.className = compact ? "compact" : "";
    list.style.maxHeight = Math.max(0, maxh - 46) + "px";
    $("count").textContent = "";
    lastItems = null;
    nova.complete(null);
    open = true;
    c.focus();
    show(text);
    nova.send("text " + text);
  };
  const out = nova.out;
  nova.out = () => { open = false; out(); };
  // Completion / history: replace the text, keep the cursor at the end, don't report it as typed.
  nova.setText = (text) => show(text);

  const c = $("cmd");
  // window.rs focuses the view; the keys belong in the input
  addEventListener("focus", () => open && c.focus());
  // a click on the page (or another window) takes the focus away: close, like a menu
  addEventListener("blur", () => open && nova.send("cmdleave"));
  // Deleting the leading ":" leaves command mode (qutebrowser); an emptied address stays open.
  c.addEventListener("input", () => nova.send(c.value === "" && !pre ? "cmdleave" : "text " + full()));
  let killed = "";
  // Readline edits (qutebrowser command-mode defaults). Word = run of non-space.
  // Kills stop at the leading ":".
  const edit = (from, to, newCursor, kill) => {
    const lo = !pre && c.value.startsWith(":") ? 1 : 0;
    from = Math.max(from, lo);
    newCursor = Math.max(newCursor, lo);
    if (from >= to) return;
    if (kill) killed = c.value.slice(from, to);
    c.setRangeText("", from, to);
    c.setSelectionRange(newCursor, newCursor);
    nova.send("text " + full());
  };
  const wordBack = (p) => { while (p > 0 && c.value[p - 1] === " ") p--; while (p > 0 && c.value[p - 1] !== " ") p--; return p; };
  const wordFwd = (p) => { const n = c.value.length; while (p < n && c.value[p] === " ") p++; while (p < n && c.value[p] !== " ") p++; return p; };
  const move = (p) => c.setSelectionRange(p, p);
  c.addEventListener("keydown", (e) => {
    const p = c.selectionStart, k = e.key, ctrl = e.ctrlKey && !e.altKey, alt = e.altKey && !e.ctrlKey;
    const act = (
      k === "Enter" ? () => (pre === ":bindings " || (pre && !c.value.trim()) ? nova.send("cmdleave") : nova.send("run " + full())) :
      k === "Escape" || (ctrl && k === "[") ? () => nova.send("cmdleave") :
      k === "Backspace" && !ctrl && !alt && c.value === "" ? () => nova.send("cmdleave") :
      k === "Tab" && !ctrl && !alt ? () => nova.send(e.shiftKey ? "complete -1" : "complete 1") :
      // arrows move in the list when one is shown, else browse command history (Ctrl-p/n always do)
      (k === "ArrowUp" || k === "ArrowDown") && !ctrl && !alt && list.firstChild ? () => nova.send(k === "ArrowUp" ? "complete -1" : "complete 1") :
      k === "ArrowUp" || (ctrl && k === "p") ? () => nova.send("hist -1") :
      k === "ArrowDown" || (ctrl && k === "n") ? () => nova.send("hist 1") :
      ctrl && k === "a" ? () => move(!pre && c.value.startsWith(":") ? 1 : 0) :
      ctrl && k === "e" ? () => move(c.value.length) :
      ctrl && k === "b" ? () => move(Math.max(0, p - 1)) :
      ctrl && k === "f" ? () => move(p + 1) :
      alt && k === "b" ? () => move(wordBack(p)) :
      alt && k === "f" ? () => move(wordFwd(p)) :
      ctrl && k === "u" ? () => edit(0, p, 0, true) :
      ctrl && k === "k" ? () => edit(p, c.value.length, p, true) :
      ctrl && k === "w" ? () => edit(wordBack(p), p, wordBack(p), true) :
      alt && k === "d" ? () => edit(p, wordFwd(p), p, true) :
      ctrl && k === "h" ? () => p > 0 && edit(p - 1, p, p - 1, false) :
      ctrl && k === "y" ? () => { c.setRangeText(killed, p, p, "end"); nova.send("text " + full()); } :
      null);
    if (act) { e.preventDefault(); act(); }
  });
  nova.send("ready");
</script>
</body>
