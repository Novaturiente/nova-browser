<!doctype html>
<meta charset="utf-8">
<title>completion</title>
<style>
  /* Colours/fonts are CSS variables from config (theme.rs), set by nova.theme. */
  body { margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column;
         color: var(--colors-completion-fg, #fff); background: var(--colors-completion-even-bg, #333);
         font: var(--fonts-completion-entry, 10pt monospace); }
  #title { padding: 1px 6px; font: var(--fonts-completion-category, bold 10pt monospace);
           color: var(--colors-completion-category-fg); background: var(--colors-completion-category-bg);
           border-top: 1px solid var(--colors-completion-category-border-top);
           border-bottom: 1px solid var(--colors-completion-category-border-bottom); }
  #list { flex: 1; overflow: hidden; }
  .row { display: flex; padding: 1px 6px; white-space: nowrap; background: var(--colors-completion-even-bg);
         border-top: 1px solid transparent; border-bottom: 1px solid transparent; }
  .row:nth-child(odd) { background: var(--colors-completion-odd-bg); }
  .row.sel { color: var(--colors-completion-item-selected-fg); background: var(--colors-completion-item-selected-bg);
             border-top-color: var(--colors-completion-item-selected-border-top);
             border-bottom-color: var(--colors-completion-item-selected-border-bottom); }
  .a { flex: 0 1 60%; overflow: hidden; text-overflow: ellipsis; padding-right: 12px; }
  .b { flex: 1; overflow: hidden; text-overflow: ellipsis; opacity: .8; }
</style>
<body><div id="title"></div><div id="list"></div>
<script>
  nova.theme = (t) => {
    for (const [k, v] of Object.entries(t.vars)) document.documentElement.style.setProperty(k, v);
  };
  // Core → UI: nova.apply({title, items: [[text, description]], sel}).
  const list = document.getElementById("list");
  nova.apply = (s) => {
    document.getElementById("title").textContent = s.title;
    list.replaceChildren(...s.items.map(([a, b], i) => {
      const row = document.createElement("div");
      row.className = i === s.sel ? "row sel" : "row";
      for (const [cls, text] of [["a", a], ["b", b]]) {
        const d = document.createElement("div");
        d.className = cls;
        d.textContent = text;
        row.append(d);
      }
      return row;
    }));
    list.children[s.sel]?.scrollIntoView({ block: "nearest" });
  };
  nova.send("ready");
</script>
</body>
