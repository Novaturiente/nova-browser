<style>
  /* Shared by every UI page (window.rs ui_page puts it where a page has the glass marker).
     CEF views can't be transparent, so an overlay paints the page behind itself: a
     screenshot of the active tab, offset to the overlay's place (nova.glass). `.glass`
     surfaces blur it like Safari's materials; `.pop` plays the spring in / fade out. */
  :root { --ease-spring: cubic-bezier(.32, .72, 0, 1); --ease-out: cubic-bezier(.2, .8, .2, 1);
          --accent: var(--colors-tabs-indicator-start, #0a84ff);
          --tint: var(--colors-completion-even-bg, #2a2a2c);
          --ink: var(--colors-completion-fg, #f2f2f7);
          --hairline: color-mix(in srgb, var(--ink) 14%, transparent); }
  html { background: var(--colors-tabs-bar-bg, #1c1c1e); }
  html.backdrop { background: var(--backdrop) calc(-1 * var(--bdx)) calc(-1 * var(--bdy)) / var(--bdw) var(--bdh) no-repeat; }
  html.backdrop body { background: transparent !important; }
  .glass { background: color-mix(in srgb, var(--tint) 72%, transparent);
           backdrop-filter: blur(28px) saturate(1.8);
           border: 1px solid var(--hairline);
           box-shadow: var(--shadow, 0 14px 34px rgba(0, 0, 0, .30), 0 2px 6px rgba(0, 0, 0, .18)),
                       inset 0 1px 0 color-mix(in srgb, #fff 8%, transparent); }
  /* small overlays: the view is exactly the card (window.rs glass_pad), so no margin
     shows a frozen screenshot of a page that has changed since (a box round the card) */
  :root.tight body { padding: 0 !important; }
  :root.tight { --shadow: 0 0 0 transparent; }
  .pop { animation: glass-in 280ms var(--ease-spring) both; transform-origin: var(--origin, 50% 0); }
  .pop.out { animation: glass-out 150ms ease-in both; }
  @keyframes glass-in { from { opacity: 0; transform: translateY(var(--rise, -8px)) scale(.94); } }
  @keyframes glass-out { from { opacity: 1; } to { opacity: 0; transform: scale(.97); } }
  @media (prefers-reduced-motion: reduce) { .pop, .pop.out { animation-duration: 1ms; } }
  /* filled while parked off screen: only the backdrop until window.rs moves it in */
  html.wait .pop { visibility: hidden; animation: none; }
</style>
<script>
  // nova.vars(theme): the config's colours/fonts as CSS variables (theme.rs)
  nova.vars = (t) => { for (const [k, v] of Object.entries(t.vars)) document.documentElement.style.setProperty(k, v); };
  // nova.glass({img, x, y, w, h}) paints the page screenshot `img` (w x h CSS px, the
  // content area) shifted by the overlay's offset (x, y) inside it; null = theme colour.
  nova.glass = (g) => {
    const r = document.documentElement;
    r.classList.toggle("backdrop", !!g);
    if (!g) return r.style.removeProperty("--backdrop");
    r.style.setProperty("--backdrop", `url(${g.img})`);
    for (const [k, v] of [["--bdx", g.x], ["--bdy", g.y], ["--bdw", g.w], ["--bdh", g.h]]) r.style.setProperty(k, v + "px");
  };
  // Replay the entry animation on the page's surface; nova.out() fades it before
  // window.rs hides the overlay (views can't fade themselves).
  nova.surface = () => document.querySelector(".pop") || document.body;
  // first frame painted (window.rs keeps each new overlay 1 px on screen until then)
  addEventListener("load", () => requestAnimationFrame(() => requestAnimationFrame(() => nova.send("painted"))));
  // nova.show(gen, glass, fill): window.rs parked the view; decode the backdrop, paint
  // it with the content (fill), then say "glassready gen" so it moves on screen.
  let showing = 0;
  nova.show = async (gen, g, fill) => {
    showing = gen;
    document.documentElement.classList.add("wait");
    if (g) { const im = new Image(); im.src = g.img; try { await im.decode(); } catch (e) {} }
    if (showing !== gen) return;
    nova.glass(g);
    fill();
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    if (showing === gen) nova.send("glassready " + gen);
  };
  // on screen now: play the entrance
  nova.play = () => { document.documentElement.classList.remove("wait"); nova.in(); };
  nova.in = () => { const s = nova.surface(); s.classList.remove("out"); s.style.animation = "none"; void s.offsetWidth; s.style.animation = ""; };
  nova.out = () => nova.surface().classList.add("out");
</script>
