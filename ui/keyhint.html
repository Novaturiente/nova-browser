<!doctype html>
<meta charset="utf-8">
<title>keyhint</title>
<!--glass-->
<script>document.documentElement.classList.add("tight");</script>
<style>
  /* Which-key: keys that can follow the pending prefix, a glass card bottom-right. */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { box-sizing: border-box; padding: 12px 12px 14px; -webkit-font-smoothing: antialiased;
         font: var(--fonts-keyhint, 10pt monospace); color: var(--colors-keyhint-fg, var(--ink)); }
  #list { --rise: 10px; --origin: 100% 100%; height: 100%; box-sizing: border-box; padding: 8px 12px; border-radius: 14px; overflow: hidden; }
  .row { display: flex; gap: 14px; white-space: nowrap; line-height: 1.6; }
  .k { flex: 0 0 auto; min-width: 4ch; }
  .p { opacity: .45; }
  .s { color: var(--colors-keyhint-suffix-fg, var(--accent)); font-weight: bold; }
  .c { flex: 1; overflow: hidden; text-overflow: ellipsis; opacity: .75; }
</style>
<body><div id="list" class="glass pop"></div>
<script>
  nova.theme = nova.vars;
  // nova.keyhint(prefix, [[rest, command], ...])
  nova.keyhint = (prefix, rows) => {
    const el = (cls, text) => Object.assign(document.createElement("span"), { className: cls, textContent: text });
    document.getElementById("list").replaceChildren(...rows.map(([rest, cmd]) => {
      const r = document.createElement("div");
      r.className = "row";
      const k = el("k", "");
      k.append(el("p", prefix), el("s", rest));
      r.append(k, el("c", cmd));
      return r;
    }));
    nova.in();
  };
  nova.send("ready");
</script>
</body>
