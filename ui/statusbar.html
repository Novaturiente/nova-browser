<!doctype html>
<meta charset="utf-8">
<title>statusbar</title>
<style>
  /* Colours/fonts/padding are CSS variables from config (theme.rs), set by nova.theme. */
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; overflow: hidden; box-sizing: border-box;
         padding: var(--statusbar-padding, 1px); font: var(--fonts-statusbar, 10pt monospace);
         color: var(--colors-statusbar-normal-fg, #fff); background: var(--colors-statusbar-normal-bg, #000); }
  body.insert { color: var(--colors-statusbar-insert-fg); background: var(--colors-statusbar-insert-bg); }
  body.passthrough { color: var(--colors-statusbar-passthrough-fg); background: var(--colors-statusbar-passthrough-bg); }
  body.command { color: var(--colors-statusbar-command-fg); background: var(--colors-statusbar-command-bg); }
  span { padding: 0 4px; white-space: nowrap; }
  span:empty { display: none; }
  #msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #msg:empty { display: block; }
  #msg.error { color: var(--colors-messages-error-fg); background: var(--colors-messages-error-bg); }
  #msg.warning { color: var(--colors-messages-warning-fg); background: var(--colors-messages-warning-bg); }
  #msg.info { color: var(--colors-messages-info-fg); background: var(--colors-messages-info-bg); }
  #cmd { flex: 1; min-width: 0; display: none; background: transparent; color: inherit; border: 0; outline: 0;
         font: inherit; padding: 0 4px; }
  body.command #cmd { display: block; } body.command #msg { display: none; }
  #url { max-width: 60%; overflow: hidden; text-overflow: ellipsis; color: var(--colors-statusbar-url-fg); }
  #url.https { color: var(--colors-statusbar-url-success-https-fg); }
  #url.http { color: var(--colors-statusbar-url-success-http-fg); }
  #url.crashed { color: var(--colors-statusbar-url-error-fg); }
  #progress { width: 80px; height: 0.6em; padding: 0; margin: 0 4px; display: none; }
  #progress.on { display: block; }
  #progress div { height: 100%; background: var(--colors-statusbar-progress-bg); }
</style>
<body>
<span id="mode"></span><input id="cmd" spellcheck="false"><span id="msg"></span><span id="widgets"></span>
<script>
  const $ = (id) => document.getElementById(id);
  // statusbar.widgets: which pieces show on the right, in order.
  // shortcut: scroll/scroll_raw/search_match/clock aren't built yet and show nothing.
  let widgets = ["keypress", "search_match", "url", "scroll", "history", "tabs", "progress"];
  const W = {};
  const build = () => {
    const box = $("widgets");
    box.replaceChildren();
    box.style.display = "contents";
    for (const w of widgets) {
      const el = document.createElement(w === "progress" ? "div" : "span");
      el.id = w;
      if (w === "progress") el.append(document.createElement("div"));
      if (w.startsWith("text:")) el.textContent = w.slice(5);
      box.append(el);
      W[w] = el;
    }
  };
  build();
  nova.theme = (t) => {
    for (const [k, v] of Object.entries(t.vars)) document.documentElement.style.setProperty(k, v);
    if (JSON.stringify(t.widgets) !== JSON.stringify(widgets)) { widgets = t.widgets; build(); }
  };
  // Core → UI: nova.apply({url, p, loading, crashed, mode, modename, cmd, keys, level, msg, tab, hist}).
  nova.apply = (s) => {
    document.body.className = s.cmd ? "command" : s.modename;
    $("mode").textContent = s.mode;
    $("msg").textContent = s.msg;
    $("msg").className = s.level;
    if (W.keypress) W.keypress.textContent = s.keys;
    if (W.url) {
      W.url.textContent = (s.crashed ? "[crashed] " : "") + s.url;
      W.url.className = s.crashed ? "crashed" : s.url.startsWith("https:") ? "https" : s.url.startsWith("http:") ? "http" : "";
    }
    if (W.tabs) W.tabs.textContent = s.tab;
    if (W.history) W.history.textContent = s.hist;
    if (W.progress) {
      W.progress.className = s.loading ? "on" : "";
      W.progress.firstChild.style.width = Math.round(s.p * 100) + "%";
    }
  };
  // cmd-set-text: show the input with text, cursor at the end.
  nova.cmdline = (text) => {
    document.body.className = "command";
    const c = $("cmd");
    c.value = text;
    c.focus();
    c.setSelectionRange(text.length, text.length);
    nova.send("text " + text);
  };
  // Completion / history: replace the text, keep the cursor at the end, don't report it as typed.
  nova.setText = (text) => { const c = $("cmd"); c.value = text; c.setSelectionRange(text.length, text.length); };

  const c = $("cmd");
  // Deleting the leading ":" leaves command mode (qutebrowser).
  c.addEventListener("input", () => nova.send(c.value === "" ? "cmdleave" : "text " + c.value));
  let killed = "";
  // Readline edits (qutebrowser command-mode defaults). Word = run of non-space.
  // Kills stop at the leading ":".
  const edit = (from, to, newCursor, kill) => {
    const lo = c.value.startsWith(":") ? 1 : 0;
    from = Math.max(from, lo);
    newCursor = Math.max(newCursor, lo);
    if (from >= to) return;
    if (kill) killed = c.value.slice(from, to);
    c.setRangeText("", from, to);
    c.setSelectionRange(newCursor, newCursor);
    nova.send("text " + c.value);
  };
  const wordBack = (p) => { while (p > 0 && c.value[p - 1] === " ") p--; while (p > 0 && c.value[p - 1] !== " ") p--; return p; };
  const wordFwd = (p) => { const n = c.value.length; while (p < n && c.value[p] === " ") p++; while (p < n && c.value[p] !== " ") p++; return p; };
  const move = (p) => c.setSelectionRange(p, p);
  c.addEventListener("keydown", (e) => {
    const p = c.selectionStart, k = e.key, ctrl = e.ctrlKey && !e.altKey, alt = e.altKey && !e.ctrlKey;
    const act = (
      k === "Enter" ? () => nova.send("run " + c.value) :
      k === "Escape" || (ctrl && k === "[") ? () => nova.send("cmdleave") :
      k === "Backspace" && !ctrl && !alt && c.value === "" ? () => nova.send("cmdleave") :
      k === "Tab" && !ctrl && !alt ? () => nova.send(e.shiftKey ? "complete -1" : "complete 1") :
      k === "ArrowUp" || (ctrl && k === "p") ? () => nova.send("hist -1") :
      k === "ArrowDown" || (ctrl && k === "n") ? () => nova.send("hist 1") :
      ctrl && k === "a" ? () => move(c.value.startsWith(":") ? 1 : 0) :
      ctrl && k === "e" ? () => move(c.value.length) :
      ctrl && k === "b" ? () => move(Math.max(0, p - 1)) :
      ctrl && k === "f" ? () => move(p + 1) :
      alt && k === "b" ? () => move(wordBack(p)) :
      alt && k === "f" ? () => move(wordFwd(p)) :
      ctrl && k === "u" ? () => edit(0, p, 0, true) :
      ctrl && k === "k" ? () => edit(p, c.value.length, p, true) :
      ctrl && k === "w" ? () => edit(wordBack(p), p, wordBack(p), true) :
      alt && k === "d" ? () => edit(p, wordFwd(p), p, true) :
      ctrl && k === "h" ? () => p > 0 && edit(p - 1, p, p - 1, false) :
      ctrl && k === "y" ? () => { c.setRangeText(killed, p, p, "end"); nova.send("text " + c.value); } :
      null);
    if (act) { e.preventDefault(); act(); }
  });
  nova.send("ready");
</script>
</body>
